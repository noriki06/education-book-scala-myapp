<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 730" width="1040" font-family="sans-serif" font-size="14">
  <rect x="0" y="0" width="1040" height="730" fill="#ffffff"/>

  <text x="520" y="28" text-anchor="middle" font-weight="bold" fill="#1e293b">ER 図 — 匿名イベントアプリのデータの繋がり</text>

  <!-- ================= Member ================= -->
  <rect x="40" y="70" width="260" height="160" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <rect x="40" y="70" width="260" height="34" rx="6" fill="#2563eb"/>
  <text x="54" y="86" font-size="12" font-weight="bold" fill="#ffffff">会員</text>
  <text x="54" y="99" font-size="9" fill="#dbeafe">Member</text>
  <text x="288" y="86" text-anchor="end" font-size="10" fill="#ffffff">member</text>
  <text x="54" y="122" font-size="11" fill="#334155">会員 ID</text>
  <text x="54" y="144" font-size="11" fill="#334155">公開用 UUID（連番を晒さない）</text>
  <text x="54" y="166" font-size="11" fill="#334155">メール（ログイン ID・一意）</text>
  <text x="54" y="188" font-size="11" fill="#334155">表示名（開示・レビューに出る）</text>
  <text x="54" y="210" font-size="11" fill="#334155">状態（有効 / 無効）</text>

  <!-- ================= MemberPassword ================= -->
  <rect x="40" y="276" width="260" height="96" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <rect x="40" y="276" width="260" height="34" rx="6" fill="#2563eb"/>
  <text x="54" y="292" font-size="12" font-weight="bold" fill="#ffffff">認証情報</text>
  <text x="54" y="305" font-size="9" fill="#dbeafe">MemberPassword</text>
  <text x="288" y="292" text-anchor="end" font-size="10" fill="#ffffff">member</text>
  <text x="54" y="328" font-size="11" fill="#334155">会員 ID（1 人に 1 行）</text>
  <text x="54" y="350" font-size="11" fill="#334155">パスワードハッシュ</text>

  <!-- ================= MemberSession ================= -->
  <rect x="40" y="440" width="260" height="118" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <rect x="40" y="440" width="260" height="34" rx="6" fill="#2563eb"/>
  <text x="54" y="456" font-size="12" font-weight="bold" fill="#ffffff">セッション</text>
  <text x="54" y="469" font-size="9" fill="#dbeafe">MemberSession</text>
  <text x="288" y="456" text-anchor="end" font-size="10" fill="#ffffff">member</text>
  <text x="54" y="492" font-size="11" fill="#334155">会員 ID</text>
  <text x="54" y="514" font-size="11" fill="#334155">トークン（一意）</text>
  <text x="54" y="536" font-size="11" fill="#334155">有効期限</text>

  <!-- ================= EventEntry ================= -->
  <rect x="390" y="120" width="250" height="118" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
  <rect x="390" y="120" width="250" height="34" rx="6" fill="#16a34a"/>
  <text x="404" y="136" font-size="12" font-weight="bold" fill="#ffffff">参加</text>
  <text x="404" y="149" font-size="9" fill="#dcfce7">EventEntry</text>
  <text x="628" y="136" text-anchor="end" font-size="10" fill="#ffffff">event</text>
  <text x="404" y="172" font-size="11" fill="#334155">イベント ID</text>
  <text x="404" y="194" font-size="11" fill="#334155">会員 ID（成立まで誰にも見えない）</text>
  <text x="404" y="216" font-size="11" fill="#334155">※ イベント × 会員の組で一意</text>

  <!-- ================= Event ================= -->
  <rect x="700" y="50" width="300" height="268" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
  <rect x="700" y="50" width="300" height="34" rx="6" fill="#16a34a"/>
  <text x="714" y="66" font-size="12" font-weight="bold" fill="#ffffff">イベント</text>
  <text x="714" y="79" font-size="9" fill="#dcfce7">Event</text>
  <text x="988" y="66" text-anchor="end" font-size="10" fill="#ffffff">event</text>
  <text x="714" y="102" font-size="11" fill="#334155">公開用 ID（URL に使う）</text>
  <text x="714" y="124" font-size="11" fill="#334155">立案者の会員 ID（誰にも表示しない）</text>
  <text x="714" y="146" font-size="11" fill="#334155">内容（「今日ランチ行きたい」）</text>
  <text x="714" y="168" font-size="11" fill="#334155">集合日時</text>
  <text x="714" y="190" font-size="11" fill="#334155">締切（集合日時まで）</text>
  <text x="714" y="212" font-size="11" fill="#334155">成立人数（立案者込み・2 以上）</text>
  <text x="714" y="234" font-size="11" fill="#334155">投稿先チャンネル</text>
  <text x="714" y="256" font-size="11" fill="#334155">投稿の記録（投稿前は無し）</text>
  <text x="714" y="278" font-size="11" fill="#334155">成立日時（成立前は無し）</text>
  <text x="714" y="300" font-size="11" fill="#334155">状態（募集中/成立/終了/不成立/取消）</text>

  <!-- ================= Place ================= -->
  <rect x="700" y="436" width="300" height="96" rx="6" fill="#fffbeb" stroke="#d97706"/>
  <rect x="700" y="436" width="300" height="34" rx="6" fill="#d97706"/>
  <text x="714" y="452" font-size="12" font-weight="bold" fill="#ffffff">店</text>
  <text x="714" y="465" font-size="9" fill="#fef3c7">Place</text>
  <text x="988" y="452" text-anchor="end" font-size="10" fill="#ffffff">place</text>
  <text x="714" y="488" font-size="11" fill="#334155">Google の店への参照（手動登録なら無し）</text>
  <text x="714" y="510" font-size="11" fill="#334155">店名（Google からの写し / 手動入力）</text>

  <!-- ================= PlaceReview ================= -->
  <rect x="390" y="470" width="250" height="140" rx="6" fill="#fffbeb" stroke="#d97706"/>
  <rect x="390" y="470" width="250" height="34" rx="6" fill="#d97706"/>
  <text x="404" y="486" font-size="12" font-weight="bold" fill="#ffffff">レビュー</text>
  <text x="404" y="499" font-size="9" fill="#fef3c7">PlaceReview</text>
  <text x="628" y="486" text-anchor="end" font-size="10" fill="#ffffff">place</text>
  <text x="404" y="522" font-size="11" fill="#334155">店 ID</text>
  <text x="404" y="544" font-size="11" fill="#334155">会員 ID（実名で出る）</text>
  <text x="404" y="566" font-size="11" fill="#334155">星（1〜5）</text>
  <text x="404" y="588" font-size="11" fill="#334155">一言（時間帯・行列もここに書く）</text>

  <!-- ================= relations ================= -->
  <!-- Member 1:1 MemberPassword -->
  <path d="M150,230 V276" fill="none" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="160" y="258" font-size="12" font-weight="bold" fill="#5b21b6">1 : 1</text>
  <!-- Member 1:* MemberSession -->
  <path d="M300,210 H320 V480 H300" fill="none" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="326" y="352" font-size="12" font-weight="bold" fill="#5b21b6">1 : *</text>
  <!-- Member 1:* EventEntry -->
  <path d="M300,150 H390" fill="none" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="345" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#5b21b6">1 : *</text>
  <!-- EventEntry *:1 Event -->
  <path d="M640,150 H700" fill="none" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="670" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#5b21b6">* : 1</text>
  <!-- Member 1:* PlaceReview -->
  <path d="M300,190 H340 V540 H390" fill="none" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="346" y="440" font-size="12" font-weight="bold" fill="#5b21b6">1 : *</text>
  <!-- Place 1:* PlaceReview -->
  <path d="M700,500 H640" fill="none" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="670" y="492" text-anchor="middle" font-size="12" font-weight="bold" fill="#5b21b6">1 : *</text>
  <!-- Event → Member（立案者・IDだけの参照） -->
  <path d="M700,64 H180 V70" fill="none" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="440" y="56" text-anchor="middle" font-size="11" fill="#5b21b6">立案者の ID を持つ（誰にも表示しない）</text>

  <!-- ================= note ================= -->
  <rect x="40" y="640" width="960" height="62" rx="8" fill="#fffbeb" stroke="#d97706"/>
  <text x="58" y="661" font-size="11" font-weight="bold" fill="#92400e">この図で確認するのは「どこに何があって、いくつ繋がるか」だけです</text>
  <text x="58" y="678" font-size="11" fill="#92400e">必須か任意か・日時の持ち方は、このあとの EntityModel で定義します。点線はコンテキストをまたぐ ID 参照（一方向）。イベントは店を知らず、place と member の世界もイベントを知らない。</text>
  <text x="58" y="694" font-size="11" fill="#92400e">updatedAt / createdAt は全エンティティが持つため省略しています。</text>
</svg>
