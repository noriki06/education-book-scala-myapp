# ~~~~~
# Main configuration file for the application (local development).
#
# NOTE: This is a training template. Do NOT put real secrets or credentials
#       here — the values below are placeholders for local development only.
# ~~~~~

# Change this before running anywhere but local development.
play.http.secret.key   = "changeme-local-dev-secret-please-override"
play.http.errorHandler = mvc.ErrorHandler

# The frontend (SvelteKit) calls this API from a different origin during dev,
# so CSRF / AllowedHosts filters are disabled for simplicity.
play.filters.disabled += play.filters.csrf.CSRFFilter
play.filters.disabled += play.filters.hosts.AllowedHostsFilter

# Infrastructure bindings (Slick profile + database context).
play.modules.enabled += mvc.AppModule

play.i18n.langs       = ["ja"]
play.i18n.defaultLang = "ja"

# ---------------------------------------------------------------------------
# Database: MySQL (ixias) — used by the SlickTable data sources.
# The "app" sub-block matches DataSourceFactory("ixias.db.mysql://.../app").
# ---------------------------------------------------------------------------
ixias.db.mysql {
  username = "app"
  password = "pass"
  driver   = "com.mysql.cj.jdbc.Driver"
  hostspec.primary.readonly      = false
  hostspec.primary.max_pool_size = 1
  hostspec.replica.readonly      = true
  hostspec.replica.max_pool_size = 1
  app {
    database               = "app?allowPublicKeyRetrieval=true&useSSL=false"
    hostspec.primary.hosts = "127.0.0.1:13306"
    hostspec.replica.hosts = "127.0.0.1:13306"
  }
}

# ---------------------------------------------------------------------------
# Database: connection settings read by the flyway-sbt task (see build.sbt).
# Migrations live in etc/database/migration/app/common. Apply with:
#   (cd app-api && sbt flywayMigrate)
# ---------------------------------------------------------------------------
db.app {
  driver   = "com.mysql.cj.jdbc.Driver"
  username = ${ixias.db.mysql.username}
  password = ${ixias.db.mysql.password}
  url      = "jdbc:mysql://127.0.0.1:13306/app?allowPublicKeyRetrieval=true&useSSL=false"
}
