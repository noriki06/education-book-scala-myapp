openapi: '3.1.0'
info:
  title: Education Book API
  version: 1.0.0
  description: >-
    Training template API. Authentication is a signed `session` cookie issued
    by signup / login and resolved server-side against `udb_user_session` on
    every request.
  license:
    name: IxiaS
servers:
  - url: http://localhost:9000
    description: Local Development
paths:
  /ping:
    get:
      $ref: './paths/ping.yaml'
  /member/api/signup:
    post:
      $ref: './paths/member-signup.yaml'
  /member/api/login:
    post:
      $ref: './paths/member-login.yaml'
  /member/api/logout:
    post:
      $ref: './paths/member-logout.yaml'
  /member/api/me:
    get:
      $ref: './paths/member-me.yaml'
