summary: Health Check
description: >-
  Health check endpoint for system monitoring. Used by load balancers and
  monitoring systems to verify system availability. Requires no authentication.
parameters: []
responses:
  200:
    description: System is operational
    content:
      text/plain:
        schema:
          type: string
          examples:
            - "ok"
