#
# Local development infrastructure. Minimal: MySQL only.
# (Production additionally runs an nginx reverse proxy for TLS / subdomain routing.)
#

services:
  # DB: MySQL
  mysql:
    image: 'mysql/mysql-server:8.0'
    environment:
      TZ: 'Asia/Tokyo'
      MYSQL_ROOT_PASSWORD: 'pass'
    # 13307 (not the usual 13306): the curriculum's scaffold repo publishes its
    # own MySQL on 13306, and both must be able to run at once.
    ports:
      - 13307:3306
    volumes:
      # init.sql creates the `app` database + user on first start.
      - ./etc/docker/mysql/data:/docker-entrypoint-initdb.d
      - ./etc/docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
